group: minerva_math_reasoning
task:
  - minerva_math_algebra
  - minerva_math_counting_and_prob
  - minerva_math_geometry
  - minerva_math_intermediate_algebra
  - minerva_math_num_theory
  - minerva_math_prealgebra
  - minerva_math_precalc
aggregate_metric_list:
  - metric: answer_match
    aggregation: mean
    weight_by_size: true
    filter_list: reasoning-final-answer
  - metric: math_verify
    aggregation: mean
    weight_by_size: true
    filter_list: reasoning-final-answer
  - metric: exact_match
    aggregation: mean
    weight_by_size: true
    filter_list: reasoning-final-answer
doc_to_text: !function utils.doc_to_text_reasoning
process_results: !function utils.process_results_reasoning
filter_list:
  - name: reasoning-final-answer
    filter:
      - function: custom
        filter_fn: !function utils.extract_minerva_math_reasoning_answer
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: math_verify
    aggregation: mean
    higher_is_better: true
  - metric: answer_match
    aggregation: mean
    higher_is_better: true
num_fewshot: 0
metadata:
  version: 1.0
